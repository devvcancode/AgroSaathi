services:
  - type: web
    name: agrosaathi-location
    runtime: node
    rootDir: services/location
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: REDIS_URL
        fromService:
          name: agrosaathi-redis
          type: redis
          property: connectionString
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: agrosaathi-api
    runtime: docker
    dockerfilePath: ./Dockerfile.product
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: NEXT_PUBLIC_LOCATION_WS_URL
        sync: false
      - key: LOCATION_WS_URL
        sync: false
      - key: NEXT_PUBLIC_BASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_VISION_MODEL
        value: meta-llama/llama-4-scout-17b-16e-instruct
      - key: BHASHINI_ASR_ENDPOINT
        sync: false
      - key: BHASHINI_ASR_INFERENCE_KEY
        sync: false
      - key: BHASHINI_TTS_ENDPOINT
        sync: false
      - key: BHASHINI_TTS_INFERENCE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_VISION_MODEL
        value: gemini-3.6-flash
      - key: DIGILOCKER_CLIENT_ID
        sync: false
      - key: DIGILOCKER_CLIENT_SECRET
        sync: false
      - key: DIGILOCKER_REDIRECT_URI
        sync: false
      - key: DIGILOCKER_AUTH_URL
        value: https://api.digitallocker.gov.in/public/oauth2/1/authorize
      - key: DIGILOCKER_TOKEN_URL
        value: https://api.digitallocker.gov.in/public/oauth2/1/token
      - key: YIELD_MODEL_API_URL
        sync: false
      - key: CLOUD_NEXT_WEATHER_API_URL
        sync: false
      - key: CLOUD_NEXT_WEATHER_API_KEY
        sync: false
      - key: CLOUD_NEXT_WEATHER_API_VERSION
        value: v3
      - key: CEHUB_APIKEY
        sync: false
      - key: METEOBLUE_APIKEY
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: NEXT_PUBLIC_RAZORPAY_KEY_ID
        sync: false
      - key: TRANSLATION_API_URL
        sync: false
      - key: TRANSLATION_API_KEY
        sync: false
      - key: VERTEX_AI_PROJECT_ID
        sync: false
      - key: VERTEX_AI_LOCATION
        value: us-central1
      - key: VERTEX_AI_ENDPOINT_ID
        sync: false
      - key: ISRO_SATELLITE_API_URL
        sync: false
      - key: ISRO_SATELLITE_API_KEY
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
        sync: false

  - type: web
    name: agrosaathi-yield-model
    runtime: python
    rootDir: services/yield-model
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /

  - type: redis
    name: agrosaathi-redis
    plan: free
    ipAllowList: []
