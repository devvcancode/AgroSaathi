services:
  - type: web
    name: agrosaathi-api
    runtime: docker
    dockerfilePath: ./Dockerfile.product
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: agrosaathi-postgres
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: NEXT_PUBLIC_BASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: YIELD_MODEL_API_URL
        sync: false

  - type: web
    name: agrosaathi-yield-model
    runtime: python
    rootDir: services/yield-model
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /

  - type: redis
    name: agrosaathi-redis
    plan: free
    ipAllowList: []

databases:
  - name: agrosaathi-postgres
    plan: free
    databaseName: agrosaathi
    user: agrosaathi
