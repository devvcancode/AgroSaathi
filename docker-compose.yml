version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    container_name: agrosaathi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agrosaathi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: agrosaathi-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  location:
    build:
      context: ./services/location
    container_name: agrosaathi-location
    restart: unless-stopped
    environment:
      LOCATION_WS_PORT: 8787
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: http://localhost:3000
    ports:
      - '8787:8787'
    depends_on:
      - redis

volumes:
  postgres_data:
  redis_data:
